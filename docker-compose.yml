services:
  db:
    image: postgres:15-alpine
    container_name: ysu-ir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-ir_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ir_password}
      POSTGRES_DB: ${DB_DATABASE:-ir_dashboard}
    ports:
      # 호스트 포트는 로컬 PostgreSQL 충돌을 피하기 위해 기본 5433 사용 (컨테이너 내부는 5432)
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      # [절대 필수] 호스트 경로 <-> 컨테이너 데이터 디렉토리 바인딩 (데이터 영속화)
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ir_user} -d ${DB_DATABASE:-ir_dashboard}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ysu-ir-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-ir_user}
      DB_PASSWORD: ${DB_PASSWORD:-ir_password}
      DB_DATABASE: ${DB_DATABASE:-ir_dashboard}
      DATA_GO_KR_BASE_URL: ${DATA_GO_KR_BASE_URL:-https://apis.data.go.kr/B340014}
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY}
      ALIMI_UNIV_SERVICE: ${ALIMI_UNIV_SERVICE:-BasicInformationService_2}
      ALIMI_UNIV_OPERATION: ${ALIMI_UNIV_OPERATION:-getUniversityCode}
      ALIMI_DEPT_SERVICE: ${ALIMI_DEPT_SERVICE:-BasicInformationService_1}
      ALIMI_DEPT_OPERATION: ${ALIMI_DEPT_OPERATION:-getUniversityMajorCode}
      ALIMI_SERIES_SERVICE: ${ALIMI_SERIES_SERVICE:-BasicInformationService_1}
      ALIMI_SERIES_OPERATION: ${ALIMI_SERIES_OPERATION:-getCodeByLargeSeries}
      ALIMI_DEPT_CONCURRENCY: ${ALIMI_DEPT_CONCURRENCY:-2}
      ALIMI_STATS_UNIV_LIMIT: ${ALIMI_STATS_UNIV_LIMIT:-0}
      ALIMI_CALL_DELAY_MS: ${ALIMI_CALL_DELAY_MS:-1200}
      ALIMI_STATS_CONCURRENCY: ${ALIMI_STATS_CONCURRENCY:-1}
      ALIMI_BATCH_CRON: "${ALIMI_BATCH_CRON:-0 0 3 1 * *}"
      ALIMI_BATCH_TIME_ZONE: ${ALIMI_BATCH_TIME_ZONE:-Asia/Seoul}
      ALIMI_YEAR_LOOKBACK: ${ALIMI_YEAR_LOOKBACK:-3}
      YSU_UNIV_CODE: ${YSU_UNIV_CODE:-0002651}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@yeonsung.ac.kr}
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 브라우저는 rewrite를 경유하지만, SSR/서버 컴포넌트는 이 값을 사용
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:4000/api}
    container_name: ysu-ir-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://backend:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
